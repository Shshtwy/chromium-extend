<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sphere" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#679EF5"/>
      <stop offset="100%" stop-color="#AFCCF9"/>
    </radialGradient>
    <linearGradient id="strip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#BFDBFE"/>
    </radialGradient>
  </defs>

  <!-- outer sphere, single teal family instead of Chrome's red/yellow/green triad -->
  <circle cx="256" cy="256" r="220" fill="url(#sphere)"/>

  <!-- "bare" motif: one clean diagonal sweep stripped away, exposing a darker layer beneath -->
  <clipPath id="circleClip">
    <circle cx="256" cy="256" r="220"/>
  </clipPath>
  <g clip-path="url(#circleClip)">
    <path d="M -20 340 L 300 -20 L 560 -20 L 560 120 L 200 532 L -20 532 Z" fill="url(#strip)" opacity="0.9"/>
  </g>

  <!-- thin ring outline for a crisp app-icon edge -->
<!-- central core, matched to reference: thick white ring + solid blue circle -->
  <circle cx="256" cy="256" r="112" fill="#FFFFFF"/>
  <circle cx="256" cy="256" r="91" fill="#2563EB"/>
</svg>
