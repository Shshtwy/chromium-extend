name: Release Alert to Telegram

on:
  release:
    types: [published, edited, created]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify-telegram:
    name: Notify Telegram Channel
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram Alert
        env:
          BOT_TOKEN: "8611182352:AAEGuUykvf5VpKO9As4suEwIarkeQqmLH0U"
          CHAT_ID: "-1003732911431"
          RELEASE_TAG: "${{ github.event.release.tag_name }}"
          RELEASE_NAME: "${{ github.event.release.name }}"
          RELEASE_URL: "${{ github.event.release.html_url }}"
        run: |
          TAG="${RELEASE_TAG:-Manual-Trigger}"
          NAME="${RELEASE_NAME:-eGixium Browser Release}"
          URL="${RELEASE_URL:-https://github.com/NeoTurcios/chromium-extend/releases}"

          MSG="🚀 *eGixium Browser Release Update*

📦 *Tag:* \`${TAG}\`
📌 *Name:* ${NAME}
🔗 [View Release on GitHub](${URL})

✨ *Status:* Artifacts updated in eGixium build laboratory."

          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d text="${MSG}" \
            -d parse_mode="Markdown" \
            -d disable_web_page_preview=false
