name: Compilar APK arm64 en español

on:
  workflow_dispatch:
    inputs:
      clean_build:
        description: "Eliminar el directorio de salida antes de compilar"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: chromium-extend-arm64-build
  cancel-in-progress: false

jobs:
  build:
    name: Compilar Chromium Extend arm64
    runs-on: [self-hosted, linux, x64, chromium-builder]
    timeout-minutes: 1440

    steps:
      - name: Obtener el fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Comprobar capacidad del runner
        shell: bash
        run: |
          set -euo pipefail
          command -v docker
          docker_root=$(docker info --format '{{.DockerRootDir}}')
          docker_gib=$(df -BG --output=avail "$docker_root" | tail -n 1 | tr -dc '0-9')
          memory_bytes=$(free -b | awk '/^Mem:/{print $2}')
          echo "Disco disponible para volúmenes Docker: ${docker_gib} GiB"
          echo "Memoria total: ${memory_bytes} bytes"
          test "$docker_gib" -ge 100
          test "$memory_bytes" -ge 30000000000

      - name: Preparar archivos compartidos para el contenedor
        shell: bash
        run: |
          set -euo pipefail
          rm -rf exchange/patches exchange/ci exchange/artifacts
          mkdir -p exchange/ci exchange/artifacts
          cp -a patches exchange/patches
          cp scripts/ci/build_apk_in_container.sh exchange/ci/build_apk_in_container.sh
          chmod +x exchange/ci/build_apk_in_container.sh

      - name: Construir e iniciar el contenedor
        shell: bash
        run: |
          set -euo pipefail
          ./builder.sh build
          ./builder.sh start

      - name: Compilar el APK
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ inputs.clean_build }}' == 'true' ]]; then
            ./builder.sh exec bash -lc 'rm -rf /work/chromium/src/out/ChromiumExtend'
          fi
          ./builder.sh exec bash /exchange/ci/build_apk_in_container.sh

      - name: Publicar el APK como artefacto
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ChromiumExtend-es-arm64
          path: |
            exchange/artifacts/ChromiumExtend-es-arm64.apk
            exchange/artifacts/ChromiumExtend-es-arm64.apk.sha256
            exchange/artifacts/chromium-extend-build-commit.txt
            exchange/artifacts/chromium-base-commit.txt
          if-no-files-found: error
          retention-days: 14

      - name: Detener el contenedor
        if: always()
        shell: bash
        run: ./builder.sh stop || true
